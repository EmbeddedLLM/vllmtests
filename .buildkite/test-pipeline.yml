env:
  DOCKER_BUILDKIT: "1"

# Reusable configuration anchor
x-base-config: &base-config
  agents:
    queue: vllm-rocm-wheel
  retry:
    automatic:
      - exit_status: -1  # Agent lost
        limit: 1
      - exit_status: -10  # Agent terminated
        limit: 1
      - exit_status: 1  # Generic failure
        limit: 2
  timeout_in_minutes: 60


steps:
  # ============================================================================
  # Input Form - Collect Build Parameters
  # ============================================================================
  - block: ":gear: Configure Build Parameters"
    key: "input-params"
    prompt: "Select the vLLM branch and commit to test"
    fields:
      - select: "vLLM Branch"
        key: "VLLM_BRANCH"
        hint: "Select the branch to clone from github.com/vllm-project/vllm"
        required: false
        default: "main"
        options:
          - label: "Main (Stable)"
            value: "main"
          - label: "Develop (Latest)"
            value: "develop"
          - label: "v0.5.0 (Release)"
            value: "v0.5.0"
          - label: "v0.4.2 (Older Release)"
            value: "v0.4.2"
      - text: "vLLM Commit"
        key: "VLLM_COMMIT"
        hint: "Enter commit SHA or 'latest' for HEAD of selected branch"
        required: false
        default: "latest"

  # ============================================================================
  # Build Phase
  # ============================================================================
  - group: ":docker: Build Phase"
    key: "build-group"
    depends_on: "input-params"
    steps:
      - label: ":docker: Clone & Build vLLM Docker Image"
        key: "build-vllm-docker"
        <<: *base-config
        timeout_in_minutes: 120
        commands:
          # Retrieve build parameters from block step
          - echo "Retrieving build parameters..."
          - echo "=== Debug Available Metadata Keys ==="
          - buildkite-agent meta-data keys
          - echo "=== End Debug ==="
          - |
            # Retrieve from block step metadata
            VLLM_BRANCH=$$(buildkite-agent meta-data get "VLLM_BRANCH" --default="main")
            VLLM_COMMIT=$$(buildkite-agent meta-data get "VLLM_COMMIT" --default="latest")

            echo "Raw metadata values:"
            echo "  VLLM_BRANCH='$${VLLM_BRANCH}' (length: $${#VLLM_BRANCH})"
            echo "  VLLM_COMMIT='$${VLLM_COMMIT}' (length: $${#VLLM_COMMIT})"

            # Handle empty strings (when metadata exists but is empty)
            if [[ -z "$${VLLM_BRANCH}" ]]; then
              VLLM_BRANCH="main"
              echo "⚠️  VLLM_BRANCH was empty, using default: main"
            fi

            if [[ -z "$${VLLM_COMMIT}" ]]; then
              VLLM_COMMIT="latest"
              echo "⚠️  VLLM_COMMIT was empty, using default: latest"
            fi

            export VLLM_BRANCH
            export VLLM_COMMIT
            export DOCKER_IMAGE_TAG="ghcr.io/embeddedllm/vllm-rocm-ci:$${VLLM_COMMIT}"

            echo ""
            echo "Build parameters:"
            echo "  VLLM_BRANCH=$${VLLM_BRANCH}"
            echo "  VLLM_COMMIT=$${VLLM_COMMIT}"
            echo "  DOCKER_IMAGE_TAG=$${DOCKER_IMAGE_TAG}"
            echo ""

          # Authenticate with GitHub Container Registry
          - echo "Authenticating with GitHub Container Registry..."
          - |
            if [[ -z "${GHCR_PAT:-}" ]]; then
              echo "Error: GHCR credentials not configured in agent hooks"
              echo "Please set GHCR_USERNAME and GHCR_PAT in ~/.buildkite-agent/hooks/environment"
              exit 1
            fi
            echo "${GHCR_PAT}" | docker login ghcr.io \
              -u "${GHCR_USERNAME}" \
              --password-stdin
          - echo "Successfully authenticated with GHCR"

          # Clone and build vLLM
          - echo "Cloning vLLM from branch ${VLLM_BRANCH} at commit ${VLLM_COMMIT}"
          - git clone --depth 1 --branch ${VLLM_BRANCH} https://github.com/vllm-project/vllm.git vllm-repo
          - cd vllm-repo && git checkout ${VLLM_COMMIT}
          - |
            docker build \
              -f docker/Dockerfile.rocm \
              -t ${DOCKER_IMAGE_TAG} \
              --target test \
              --build-arg REMOTE_VLLM=0 \
              --build-arg ARG_PYTORCH_ROCM_ARCH='gfx942' \
              --no-cache \
              --progress plain \
              .
          - docker push ${DOCKER_IMAGE_TAG}
          - echo "Docker image pushed successfully: ${DOCKER_IMAGE_TAG}"

          # Store image tag for test steps
          - buildkite-agent meta-data set "DOCKER_IMAGE_TAG" "${DOCKER_IMAGE_TAG}"

          # Logout for security
          - docker logout ghcr.io

  # ============================================================================
  # Qwen2.5-Omni-7B Tests
