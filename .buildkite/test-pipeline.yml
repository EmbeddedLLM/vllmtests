      - label: ":memo: Qwen2.5-7B Text Mode 1 (Eager+AITER)"
        key: "qwen25-7b-text-m1"
        depends_on: "build-vllm-docker"
        <<: *base-config
        commands:
          - export DOCKER_IMAGE_TAG=$(buildkite-agent meta-data get "DOCKER_IMAGE_TAG")
          - export DOCKER_IMAGE_TAG=$(buildkite-agent meta-data get "DOCKER_IMAGE_TAG")
          - echo "Running Qwen2.5-Omni-7B text evaluation - Mode 1"
          - echo "Using Docker image: ${DOCKER_IMAGE_TAG}"
          - echo "Using Docker image: ${DOCKER_IMAGE_TAG}"
          - |
            docker run --rm \
              --name vllm-test-qwen25-7b-text-mode1 \
              --privileged \
              --network=host \
              --device=/dev/kfd \
              --device=/dev/dri \
              --shm-size=128g \
              -v /home/amd/models:/app/model \
              -v $(pwd):/app/vllmtests \
              -e HF_HUB_CACHE=/app/model \
              ${DOCKER_IMAGE_TAG} \
              bash /app/vllmtests/vllm-omni-tests/vllm/Qwen2.5-Omni-7B_text_eval.sh 1
          - buildkite-agent artifact upload "vllm-omni-tests/vllm/eval_*.log" || true
          - buildkite-agent artifact upload "vllm-omni-tests/vllm/results_*/**/*" || true

